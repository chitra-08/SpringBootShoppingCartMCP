spring.application.name=shopping-cart-mcp
server.port = 8010

#JDBC properties
spring.datasource.url= jdbc:mysql://localhost:3306/cart_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# MCP Server Configuration
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.name=shopping-cart-server
spring.ai.mcp.server.version=1.0.0


# Critical for STDIO communication
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.pattern.console=
